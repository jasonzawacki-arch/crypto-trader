[project]
name = "gtrader"
version = "0.1.0"
description = "Crypto Trader server: paper exchange, risk, bots, backtester, HTTP API"
requires-python = ">=3.11"
dependencies = ["starlette>=0.37", "uvicorn>=0.30", "sse-starlette>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools]
packages = ["gtrader"]
